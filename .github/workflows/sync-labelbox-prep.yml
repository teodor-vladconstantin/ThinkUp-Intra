name: Sync master into labelbox-prep

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: labelbox-prep
          fetch-depth: 0
      - name: Merge master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge origin/master -m "Merge master into labelbox-prep"
          git push origin labelbox-prep
